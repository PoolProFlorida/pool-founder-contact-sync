name: PHP tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP
        run: php -v
      - name: Syntax-check all PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: API response privacy and field structure tests
        run: php tests/api_inspector_test.php
      - name: Offline API pagination tests
        run: php tests/pagination_test.php
      - name: Contact dashboard search tests
        run: php tests/search_test.php
      - name: Offline vCard tests
        run: php tests/vcard_test.php
      - name: Offline CardDAV smoke tests
        run: php tests/dav_test.php

      - name: HTTP integration smoke test (fake data only)
        run: bash tests/http_smoke.sh
